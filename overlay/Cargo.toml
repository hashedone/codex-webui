[package]
name = "codex-agent-overlay"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
fontdue = "0.9.5"
http = "1.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
ureq = { version = "3.5.0", default-features = false }
wayland-client = "0.31.15"

[profile.release]
lto = "thin"
strip = true
