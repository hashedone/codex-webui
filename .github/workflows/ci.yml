name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check native overlay
        run: |
          cargo fmt --check --manifest-path overlay/Cargo.toml
          cargo check --locked --manifest-path overlay/Cargo.toml

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Check bundles
        run: bun run check

      - name: Run hermetic test suite
        run: bun run test:ci

      - name: Build production bundles
        run: bun run build

      - name: Audit dependencies
        run: bun audit
